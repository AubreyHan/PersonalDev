<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrailMov Studio - 3D 轨迹漫游与运动数据可视化</title>
  
  <!-- MapLibre GL JS (v4 3D Terrain Engine) -->
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- TrailMov Styling -->
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="top-nav glass">
    <div class="logo-area">
      <div class="brand-logo"><span class="trail">Trail</span><span class="mov">Mov</span></div>
      <span class="badge-tag">3D Studio</span>
      <span id="track-header-title" style="font-size: 13px; color: var(--text-muted); font-weight: 600; margin-left: 8px;">
        载入轨迹中...
      </span>
    </div>

    <div class="nav-actions">
      <!-- Aspect Ratio Switcher -->
      <select id="aspect-select" class="select-pill">
        <option value="9-16">📱 9:16 竖屏 (短视频/小红书)</option>
        <option value="16-9">🖥️ 16:9 横屏 (B站/YouTube)</option>
        <option value="full">🔲 全屏预览 (Full)</option>
      </select>

      <!-- 3D Avatar Model Switcher -->
      <select id="avatar-select" class="select-pill">
        <option value="cyclist" selected>🚴🏻 专属红色骑行者 (Red Cyclist)</option>
        <option value="car">🚗 专属汽车 (Custom Car)</option>
        <option value="runner">🏃🏻 3D小红人 (3D Red Runner)</option>
        <option value="hiker">🥾 徒步者 (Hiker)</option>
        <option value="dot">⚪ 经典脉冲光标 (Pulse Pin)</option>
      </select>

      <!-- Camera Mode Switcher -->
      <select id="camera-select" class="select-pill">
        <option value="chase">🎥 稳定追焦 (Smooth Chase)</option>
        <option value="fixed">🧭 正北锁定 (North-Up Fixed)</option>
        <option value="orbit">🔄 缓速航拍环绕 (Orbit)</option>
        <option value="overview">🦅 航拍俯瞰 (Overview)</option>
      </select>

      <!-- Export MP4 Button -->
      <button id="btn-export-dialog" class="btn-primary">
        <i data-lucide="video" style="width: 16px; height: 16px;"></i>
        <span>导出高清视频</span>
      </button>

      <!-- Safety Delete GPX Button -->
      <button id="btn-safe-delete" class="btn-danger" title="视频合格后安全清理源 GPX">
        <i data-lucide="trash-2" style="width: 14px; height: 14px;"></i>
        <span>合格并清理GPX</span>
      </button>
    </div>
  </header>

  <!-- Main Viewport Container -->
  <main class="studio-container">
    <div id="viewport-frame" class="viewport-wrapper aspect-9-16">
      
      <!-- 3D WebGL Map Container -->
      <div id="map-container"></div>

      <!-- Glassmorphic HUD Telemetry Layer -->
      <div class="hud-overlay">
        
        <!-- Top HUD Row -->
        <div style="display: flex; justify-content: space-between; align-items: flex-start; width: 100%;">
          
          <!-- Top Left: Mini-map Card -->
          <div class="hud-minimap-card glass-card">
            <canvas id="minimap-canvas" class="hud-minimap-canvas" width="120" height="130"></canvas>
          </div>

          <!-- Top Right: Distance Card -->
          <div class="hud-distance-card glass-card">
            <div class="hud-stat-header">
              <i data-lucide="navigation-2" style="width: 14px; height: 14px; transform: rotate(45deg);"></i>
              <span>Distance</span>
            </div>
            <div id="hud-distance-val" class="hud-stat-val-large">0.00</div>
            <div class="hud-stat-unit">km</div>
          </div>
        </div>

        <!-- Mid Left: Climb & Descent Card -->
        <div class="hud-climb-card glass-card">
          <div id="hud-climb-val" class="hud-climb-number">0 m</div>
          <div class="hud-climb-lbl">
            <i data-lucide="arrow-up" style="width: 13px; height: 13px; stroke-width: 3;"></i>
            <span>Ascent</span>
          </div>
          <div style="margin-top: 6px;">
            <div id="hud-descent-val" style="font-size: 16px; font-weight: 700; color: #cbd5e1;">0 m</div>
            <div style="font-size: 11px; font-weight: 600; color: #94a3b8; display: flex; align-items: center; gap: 3px;">
              <i data-lucide="arrow-down" style="width: 11px; height: 11px;"></i>
              <span>Descent</span>
            </div>
          </div>
        </div>

        <!-- Opening Title (0 ~ 1s) -->
        <div id="hud-intro-card" class="hud-intro-title">
          <div id="hud-intro-title" class="hud-intro-main">奥林匹克森林公园</div>
          <div id="hud-intro-sub" class="hud-intro-sub">5.97KM · 173m 爬升</div>
        </div>

        <!-- Bottom: Elevation Profile Card -->
        <div class="hud-elevation-card glass-card">
          <div class="hud-ele-meta">
            <span id="hud-ele-max">Max 72m</span>
            <span id="hud-ele-min">Min 26m</span>
          </div>
          <div class="hud-ele-chart-wrap">
            <svg id="elevation-svg" class="hud-ele-svg" viewBox="0 0 400 50" preserveAspectRatio="none">
              <defs>
                <linearGradient id="eleGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#DFFF00" stop-opacity="0.45" />
                  <stop offset="100%" stop-color="#DFFF00" stop-opacity="0.0" />
                </linearGradient>
              </defs>
              <!-- Total Track (Grey Baseline) -->
              <path id="svg-profile-bg" d="" fill="none" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.5" />
              <!-- Traveled Track Gradient Fill -->
              <path id="svg-profile-fill" d="" fill="url(#eleGrad)" />
              <!-- Traveled Track Highlight Line -->
              <path id="svg-profile-active" d="" fill="none" stroke="#DFFF00" stroke-width="2.5" />
            </svg>

            <!-- Real-time Altitude Pin Badge -->
            <div id="hud-cur-pin" class="hud-cur-pin" style="left: 0%;">
              <div id="hud-cur-badge-txt" class="hud-cur-badge">42m</div>
              <div class="hud-cur-dot"></div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- Bottom Playback Deck -->
  <footer class="bottom-bar glass">
    <div class="playback-controls">
      <button id="btn-play-toggle" class="btn-icon btn-play" title="播放 / 暂停 (空格键)">
        <i id="play-icon" data-lucide="play" style="width: 20px; height: 20px; margin-left: 2px;"></i>
      </button>
      <button id="btn-replay" class="btn-icon" title="重播">
        <i data-lucide="rotate-ccw" style="width: 17px; height: 17px;"></i>
      </button>

      <span id="time-display" class="time-display">00:00 / 00:36</span>

      <input id="timeline-slider" class="timeline-scrubber" type="range" min="0" max="1000" value="0" />
    </div>

    <div class="controls-right">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 12px; color: var(--text-muted); font-weight: 600;">总时长:</span>
        <select id="duration-select" class="select-pill">
          <option value="15">15 秒 (快节奏)</option>
          <option value="30">30 秒 (推荐)</option>
          <option value="36" selected>36 秒 (原声标准)</option>
          <option value="60">60 秒 (长视频)</option>
        </select>
      </div>

      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 12px; color: var(--text-muted); font-weight: 600;">地形夸张:</span>
        <select id="exaggeration-select" class="select-pill">
          <option value="1.5">1.5x 标准三维</option>
          <option value="2.2">2.2x 雄壮立体</option>
          <option value="2.8" selected>2.8x 极致立体 (强烈起伏)</option>
        </select>
      </div>
    </div>
  </footer>

  <!-- Export Video Modal -->
  <div id="export-modal" class="modal-overlay">
    <div class="modal-dialog glass-card">
      <div style="font-size: 20px; font-weight: 800; color: #fff; margin-bottom: 8px;">
        🎬 导出 TrailMov 3D 视频
      </div>
      <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">
        系统将录制当前 3D 卫星地形轨迹并生成高比特率 MP4 视频
      </p>

      <div style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; text-align: left;">
        <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer;">
          <input type="radio" name="export-aspect" value="current" checked />
          <span>导出当前比例 (<span id="modal-cur-aspect">9:16 竖屏</span>)</span>
        </label>
        <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer;">
          <input type="radio" name="export-aspect" value="both" />
          <span>同时导出 9:16 竖屏 + 16:9 横屏双版本</span>
        </label>
      </div>

      <div id="export-progress-wrap" style="display: none; margin-bottom: 20px;">
        <div style="display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 6px;">
          <span id="export-status-txt">渲染中...</span>
          <span id="export-percent-txt">0%</span>
        </div>
        <div style="width: 100%; height: 8px; background: rgba(255, 255, 255, 0.1); border-radius: 9999px; overflow: hidden;">
          <div id="export-bar" style="width: 0%; height: 100%; background: var(--accent-lime); transition: width 0.15s ease;"></div>
        </div>
      </div>

      <div style="display: flex; gap: 12px; justify-content: flex-end;">
        <button id="btn-export-cancel" class="select-pill" style="padding: 10px 20px;">取消</button>
        <button id="btn-export-start" class="btn-primary" style="padding: 10px 22px;">开始录制导出</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
