[platformio]
default_envs = m5stack-tab5

[env:m5stack-tab5]
platform = espressif32@54.3.20
platform_packages =
    platformio/toolchain-riscv32-esp@14.2.0+20260121
    platformio/toolchain-xtensa-esp-elf@14.2.0+20260121
    espressif/tool-xtensa-esp-elf-gdb@12.1.0+20221002
    espressif/tool-riscv32-esp-elf-gdb@12.1.0+20221002
board = esp32-p4-evboard
board_build.mcu = esp32p4
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DARDUINO_M5TAB5
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ESP_SDIO_PIN_CLK=12
    -DCONFIG_ESP_SDIO_PIN_CMD=13
    -DCONFIG_ESP_SDIO_PIN_D0=11
    -DCONFIG_ESP_SDIO_PIN_D1=10
    -DCONFIG_ESP_SDIO_PIN_D2=9
    -DCONFIG_ESP_SDIO_PIN_D3=8
build_src_filter =
    +<*>
    +<**/*>
lib_deps =
    m5stack/M5GFX@^0.2.30
    m5stack/M5Unified@^0.2.23
    sparkfun/SparkFun u-blox GNSS Arduino Library@^2.2.27
    mikalhart/TinyGPSPlus@^1.0.3
    greiman/SdFat@^2.2.3
    bblanchon/ArduinoJson@^7.0.0
