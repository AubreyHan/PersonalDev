[platformio]
default_envs = esp32-s3-touch-amoled-175

[env:esp32-s3-touch-amoled-175]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 921600
build_flags = 
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
    -DDISPLAY_WIDTH=466
    -DDISPLAY_HEIGHT=466
build_src_filter = 
    +<main.cpp>
    +<driver/GnssDriver_LC76G.cpp>
    +<driver/RtcDriver_PCF85063.cpp>
    +<driver/TouchDriver_CST9217.cpp>
    +<service/CarTrackService.cpp>
    +<service/TimeService_Dual.cpp>
    +<service/NetworkManager_Setup.cpp>
    +<ui/UiManager_AMOLED.cpp>
lib_deps = 
    moononournation/GFX Library for Arduino@^1.4.9
    bblanchon/ArduinoJson@^7.0.0
    mikalhart/TinyGPSPlus@^1.0.3
    lewisxhe/SensorLib@^0.2.2
    lewisxhe/XPowersLib@^0.2.6
    ricmoo/QRCode@^0.0.1

[env:m5stack-tab5]
platform = espressif32@54.3.20
platform_packages =
    platformio/toolchain-riscv32-esp@14.2.0+20260121
    platformio/toolchain-xtensa-esp-elf@14.2.0+20260121
    espressif/tool-xtensa-esp-elf-gdb@12.1.0+20221002
    espressif/tool-riscv32-esp-elf-gdb@12.1.0+20221002
board = esp32-p4-evboard
board_build.mcu = esp32p4
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = 
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
lib_deps = 
    m5stack/M5GFX@^0.2.6
    m5stack/M5Unified@^0.2.5
    sparkfun/SparkFun u-blox GNSS Arduino Library@^2.2.27
    greiman/SdFat@^2.2.3
    bblanchon/ArduinoJson@^7.0.0
