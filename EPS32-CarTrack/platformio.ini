[env:m5stack-core2]
platform = espressif32
board = m5stack-core2
framework = arduino
upload_speed = 115200
upload_port = /dev/cu.usbserial-5C9A0614151
monitor_speed = 115200
monitor_port = /dev/cu.usbserial-5C9A0614151
lib_deps = 
    m5stack/M5Unified@^0.2.0
    mikalhart/TinyGPSPlus@^1.0.3
    adafruit/Adafruit BMP280 Library@^2.6.8
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
