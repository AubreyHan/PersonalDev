[package]
name = "file-purger"
version = "0.1.0"
description = "macOS Pure Status Bar Old File Purger"
authors = ["aubreyhan"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
notify = "6.1"
globset = "0.4"
trash = "5.2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4"] }
walkdir = "2.5"
objc = "0.2"
cocoa = "0.25"
thiserror = "2.0"
dirs = "6.0"
